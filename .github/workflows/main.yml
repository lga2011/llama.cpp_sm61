name: Build llama.cpp (sm_61 + CUDA 11.8)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  watch:
    types: [started]

jobs:
  build:
    runs-on: windows-2022

    env:
      CUDA_VERSION: "11.8.0"
      CUDA_PATH: "C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v11.8"

    steps:
      - name: Checkout llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          submodules: 'recursive'

      - name: Install CMake 3.27.7
        uses: jwlawson/actions-setup-cmake@v2
        with:
          version: 3.27.7
          cmake-version: 3.27.7

      - name: Install CUDA 11.8
        uses: Jimver/cuda-toolkit@v0.2.29
        with:
          cuda: ${{ env.CUDA_VERSION }}
          method: 'network'
          sub-dir: false
          add-to-path: true

      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Verify Toolchain
        shell: cmd
        run: |
          cmake --version
          nvcc --version
          cl

      - name: Configure CMake
        shell: cmd
        run: |
          cmake -B build -G Ninja ^
            -DGGML_CUDA=ON ^
            -DGGML_NATIVE=OFF ^
            -DCMAKE_CUDA_ARCHITECTURES="61;75;86" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_CUDA_FLAGS="-allow-unsupported-compiler -Xcompiler /D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH" ^
            -DCMAKE_CXX_FLAGS="/D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH"

      - name: Build Project
        shell: cmd
        run: cmake --build build --config Release -j 8

      - name: Collect Binaries and CUDA Runtime
        shell: cmd
        run: |
          mkdir out
          copy build\bin\*.exe out\
          copy build\bin\*.dll out\
          copy "%CUDA_PATH%\bin\cudart64_110.dll" out\
          copy "%CUDA_PATH%\bin\cublas64_11.dll" out\
          copy "%CUDA_PATH%\bin\cublasLt64_11.dll" out\

      - name: Zip Artifacts
        shell: pwsh
        run: |
          Compress-Archive -Path out\* -DestinationPath llama-sm61-cudart11.8.zip


      # Create Git tag using the shortened source repository commit SHA
      - name: Create Git tag
        id: create_tag
        run: |
          cd out\
          TAG_NAME="latest"
          git tag $TAG_NAME
          git push origin $TAG_NAME
          echo "::set-output name=TAG_NAME::$TAG_NAME"

      # Upload to GitHub Releases
      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          files: llama-sm61-cudart11.8.zip
          tag_name: ${{ steps.create_tag.outputs.TAG_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
